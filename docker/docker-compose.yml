services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    # aws 模式需要憑證:掛載本機 ~/.aws(唯讀,絕不 build 進 image)
    # Windows 下 ${USERPROFILE} 會展開;mock 模式掛了也無妨
    volumes:
      - ${USERPROFILE:-~}/.aws:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: appeal
      POSTGRES_PASSWORD: appeal
      POSTGRES_DB: appeal
    ports:
      - "5433:5432"
    # PG_DATA_DIR 留空=用 named volume pgdata;填主機絕對路徑=bind mount(該路徑已有資料時 initdb 不會再跑)
    volumes:
      - ${PG_DATA_DIR:-pgdata}:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appeal"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      # 登入帳號必須是 email 格式,pgadmin 自己會擋掉不合格式的值
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-0000@0000.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-0000}
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin:
