services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    # aws 模式需要憑證:掛載本機 ~/.aws(唯讀,絕不 build 進 image)
    # Windows 下 ${USERPROFILE} 會展開;mock 模式掛了也無妨
    volumes:
      - ${USERPROFILE:-~}/.aws:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: appeal
      POSTGRES_PASSWORD: appeal
      POSTGRES_DB: appeal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appeal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
