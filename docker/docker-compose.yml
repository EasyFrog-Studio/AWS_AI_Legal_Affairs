services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    # aws 模式需要憑證:掛載本機 ~/.aws(唯讀,絕不 build 進 image)
    # Windows 下 ${USERPROFILE} 會展開;mock 模式掛了也無妨
    volumes:
      - ${USERPROFILE:-~}/.aws:/root/.aws:ro
      # local/mock 模式「原文」讀的是前處理產出的 markdown;image 不含 data/(過大且會過期),
      # 容器內解析出的路徑是 /data/output,掛不上就每個原文都回「找不到檔案」
      - ../../data/output:/data/output:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: appeal
      POSTGRES_PASSWORD: appeal
      POSTGRES_DB: appeal
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appeal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
